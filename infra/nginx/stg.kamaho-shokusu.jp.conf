# Staging host nginx: /etc/nginx/sites-available/staging
# Adapted from release:infra/nginx/kamaho-shokusu.jp.conf (9cebf07).
# Requires libnginx-mod-http-geoip2 and the DB-IP Country Lite database.
geoip2 /usr/share/GeoIP/dbip-country-lite.mmdb {
    auto_reload 5m;
    $geoip2_country_code country iso_code;
}

map $geoip2_country_code $is_jp {
    default 0;
    JP      1;
    ""      1; # Preserve the existing proposal: unknown countries are allowed.
}

map $request_method $login_limit_key {
    default "";
    POST    $binary_remote_addr;
}
limit_req_zone $login_limit_key zone=staging_login:10m rate=10r/m;
limit_req_status 429;

# Record the country and whether a blocked request reached the application.
# Avoid query strings, cookies, and request bodies in this verification log.
log_format staging_geoip '$remote_addr country=$geoip2_country_code '
                         '$request_method $uri status=$status upstream=$upstream_status';

server {
    listen 80;
    server_name stg.kamaho-shokusu.jp;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }
    location / {
        return 301 https://stg.kamaho-shokusu.jp$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name stg.kamaho-shokusu.jp;
    ssl_certificate /etc/letsencrypt/live/stg.kamaho-shokusu.jp/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stg.kamaho-shokusu.jp/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/staging-geoip-access.log staging_geoip;

    # Nginx liveness only. Does not expose an application route outside Japan.
    location = /healthz {
        default_type text/plain;
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        return 200 "ok\n";
    }

    # The deployed application lives under /kamaho-shokusu/.
    location ~* ^/(kamaho-shokusu/)?m-?user-?info/login/?$ {
        if ($is_jp = 0) { return 403; }
        limit_req zone=staging_login burst=5 nodelay;

        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        if ($is_jp = 0) { return 403; }

        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
