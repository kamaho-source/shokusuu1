# 本番ホスト nginx の設定（正本）
#
# 反映先: 本番サーバー /etc/nginx/conf.d/kamaho-shokusu.jp.conf
#
# 本番のリクエスト経路は次のとおりで、この設定が唯一の最前段である。
#   Internet:443 -> ホストnginx(このファイル) -> localhost:8091 -> kamakura-shokusu_web
# docker/nginx/nginx.conf のコンテナは経路上に無い（本番では未起動）。
#
# ---------------------------------------------------------------------------
# 初回のみ必要な準備
# ---------------------------------------------------------------------------
#   # 1. 国判定モジュールを導入
#   sudo apt install -y libnginx-mod-http-geoip2
#
#   # 2. 国別IPデータベースを配置（DB-IP の無料版。アカウント登録不要）
#   sudo mkdir -p /usr/share/GeoIP
#   curl -fsSL "https://download.db-ip.com/free/dbip-country-lite-$(date +%Y-%m).mmdb.gz" \
#     | sudo gunzip -c | sudo tee /usr/share/GeoIP/dbip-country-lite.mmdb >/dev/null
#
# データベースの更新（月次。auto_reload により nginx の reload は不要）:
#   0 4 1 * * root curl -fsSL "https://download.db-ip.com/free/dbip-country-lite-$(date +\%Y-\%m).mmdb.gz" | gunzip -c > /usr/share/GeoIP/dbip-country-lite.mmdb
#
# 反映手順（ダウンタイムなし）:
#   1. sudo cp infra/nginx/kamaho-shokusu.jp.conf /etc/nginx/conf.d/
#   2. sudo nginx -t               # 構文確認。通らなければ絶対に reload しない
#   3. sudo systemctl reload nginx # 既存接続を切らずに切り替わる
#
# 切り戻し:
#   反映前の設定は /etc/nginx/conf.d/ にバックアップを取っておくこと。
#   国内制限で問題が出た場合は、2箇所の `if ($is_jp = 0) { return 403; }` を
#   コメントアウトして nginx -t → reload すれば即座に解除できる。
#
# 変更するときはサーバー上で直接編集せず、このファイルを直してPRを出すこと。
# サーバー側だけ直すと再び乖離する。

# ---------------------------------------------------------------------------
# 国内判定
# ---------------------------------------------------------------------------
# 接続元IPから国コード（ISO 3166-1 alpha-2）を引く。
# auto_reload により、データベースを差し替えても nginx の reload は要らない。
geoip2 /usr/share/GeoIP/dbip-country-lite.mmdb {
    auto_reload 5m;
    $geoip2_country_code country iso_code;
}

map $geoip2_country_code $is_jp {
    default 0;   # 日本以外は遮断
    JP      1;

    # 国コードが引けなかった場合は通す。データベースに載っていないIPや
    # プライベートアドレスが該当する。ここを遮断側にすると、データベースの
    # 不整合や欠損でサイト全体が停止しうるため、可用性を優先する。
    ""      1;
}

# ---------------------------------------------------------------------------
# ログイン試行のレート制限
# ---------------------------------------------------------------------------
# POST のみを対象にする。GET/HEAD はキーが空文字となり nginx が計上しないため、
# ログイン画面の表示そのものは制限されない。
map $request_method $login_limit_key {
    default "";
    POST    $binary_remote_addr;
}
limit_req_zone $login_limit_key zone=login:10m rate=10r/m;
limit_req_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name kamaho-shokusu.jp www.kamaho-shokusu.jp;

    # Let's Encrypt の HTTP-01 チャレンジ。
    # 認証局は海外から接続してくるため、国内制限をかけてはならない。
    # ここを塞ぐと証明書の自動更新が失敗し、期限切れでサイト全体が停止する。
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name kamaho-shokusu.jp www.kamaho-shokusu.jp;

    ssl_certificate     /etc/letsencrypt/live/kamaho-shokusu.jp/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kamaho-shokusu.jp/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 死活監視用。国内制限の対象外とする。
    # GitHub Actions の uptime-check は海外のランナーから実行されるため、
    # 国内制限をかけた `/` を監視し続けると誤検知でアラートが鳴り続ける。
    location = /healthz {
        access_log off;

        proxy_pass http://127.0.0.1:8091/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ログイン画面。国内制限に加えてレート制限をかける。
    # アプリ側のルーティング設定(fallbacks(DashedRoute))により
    # /m-user-info/login でも同じログイン処理に到達するため、両方を拾う。
    location ~* ^/m-?user-?info/login/?$ {
        if ($is_jp = 0) {
            return 403;
        }
        limit_req zone=login burst=5 nodelay;

        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        if ($is_jp = 0) {
            return 403;
        }

        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
