services:
  # PHP-Apache
  kamakura-shokusu_web:
    container_name: kamakura-shokusu_web
    # ./myapp-web/Dockerfile でイメージをビルド
    build:
      context: ./kamakura-shokusu_web
      dockerfile: Dockerfile
    # ホスト内からのみ到達可能にする（本番はホストnginxが 127.0.0.1:8091 へ転送）
    ports:
      - "127.0.0.1:8091:80"
    # ローカル の src_web フォルダをコンテナの /var/www/html にマウント
    volumes:
      - "../src_web:/var/www/html"
      - "../datasource/phpini/php.ini:/usr/local/etc/php/php.ini:cached"

    env_file:
      - ../src_web/kamaho-shokusu/.env
    # timezone を Asia/Tokyo に設定
    environment:
      TZ: Asia/Tokyo
    networks:
      - network-inner
      - network-db

  # MySQL
  kamakura-shokusu_db:
    container_name: kamakura-shokusu_web_db
    image: mysql:lts
    # ホスト内からのみ到達可能にする（staging と同じ形に揃える）
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - "../datasource/database:/var/lib/mysql"
      - "../datasource/dump:/usr/local/dump"
    environment:
      MYSQL_DATABASE:      ${DB_NAME:-shokusu}
      MYSQL_USER:          ${DB_USER:-kamakuraadm1n}
      # 既定値を持たせない。未設定なら compose が起動時に失敗する（推測可能な初期パスワードでDBを作らせないため）
      MYSQL_PASSWORD:      ${DB_PASS:?DB_PASS must be set}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:?DB_ROOT_PASS must be set}
      TZ: Asia/Tokyo
    networks:
      - network-db

  # NGINX reverse proxy
  network-reverse:
    image: nginx:latest
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - "./nginx/nginx.conf:/etc/nginx/nginx.conf"
    networks:
      - network-reverse
      - network-inner # 修正箇所

  # network-inner サービス (追加的な例)
  network-inner:
    image: php:8.3-apache
    build:
      context: ./kamakura-shokusu_web
      dockerfile: Dockerfile
    volumes:
      - "../src_web:/var/www/html"
    networks:
      - network-inner #  修正箇
      - network-db

networks:
  network-inner:  # 定義が正しい
    name: network-inner
    internal: false
  network-reverse:
    name: network-reverse
    internal: false
  network-db:
    name: network-db
    internal: false