# nginx.conf
worker_processes auto;

events {  # この "events" セクションが必須です
    worker_connections 1024;
}

http {
    # 前段のプロキシ（ホストnginx等）から届いたリクエストに限り、
    # X-Forwarded-For を辿って実クライアントIPを $remote_addr に解決する。
    # 直接届いたリクエストではクライアントが送った X-Forwarded-For は無視される。
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.16.0.0/12;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    # ログイン試行のレート制限。キーは realip 解決後の実クライアントIP。
    # アプリ側のthrottle（10回/15分）より手前で落とすための多層防御。
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    limit_req_status 429;

    server {
        listen 80;
        server_name localhost;

        # ログインフォームのみレート制限をかける
        location = /MUserInfo/login {
            limit_req zone=login burst=5 nodelay;

            proxy_pass http://network-inner/MUserInfo/login;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host              $host;
        }

        location / {
            proxy_pass http://network-inner/;

            # 上の realip で解決済みの実クライアントIPで常に上書きする。
            # 追記（$proxy_add_x_forwarded_for）にすると多段構成で最右が中間プロキシに
            # なり、CakePHP の clientIp() が実IPを取れなくなるため上書きにしている。
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host              $host;
        }
    }
}