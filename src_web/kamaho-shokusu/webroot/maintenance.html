<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>メンテナンス中 | 食数管理システム</title>
<style>
  /* 503 中は他の CSS・画像を読めないため、すべてこのファイル内で完結させる */
  :root {
    --bg: #eef7fa; --card: #fff; --text: #1f2937; --muted: #6b7280; --line: #e5e7eb;
    --brand: #0aa2c0; --brand-soft: #e0f7fc; --warn: #b45309; --warn-soft: #fef3c7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a; --card: #1e293b; --text: #e5e7eb; --muted: #94a3b8; --line: #334155;
      --brand: #38bdf8; --brand-soft: #0c4a6e; --warn: #fbbf24; --warn-soft: #422006;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif;
    color: var(--text); line-height: 1.7;
    background: radial-gradient(circle at 20% 0%, var(--brand-soft), transparent 55%), var(--bg);
  }
  main {
    width: 100%; max-width: 30rem; background: var(--card); border-radius: 20px; overflow: hidden;
    box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 12px 32px rgba(15,23,42,.08);
  }
  .bar { height: 6px; background: linear-gradient(90deg, var(--brand), #22d3ee, var(--brand)); background-size: 200% 100%;
         animation: flow 3s linear infinite; }
  .body { padding: 2.25rem 2rem 2rem; text-align: center; }
  .icon { width: 72px; height: 72px; margin: 0 auto 1.25rem; border-radius: 50%; display: grid; place-items: center;
          background: var(--brand-soft); color: var(--brand); }
  .icon svg { width: 38px; height: 38px; animation: spin 6s linear infinite; }
  .badge { display: inline-flex; align-items: center; gap: .4rem; padding: .2rem .75rem; border-radius: 999px;
           font-size: .8rem; font-weight: 600; background: var(--warn-soft); color: var(--warn); }
  .badge::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: pulse 1.6s ease-in-out infinite; }
  h1 { font-size: 1.45rem; margin: .75rem 0 .5rem; letter-spacing: .02em; }
  .lead { text-wrap: balance; margin: 0 0 1.5rem; color: var(--muted); font-size: .95rem; }
  dl { margin: 0 0 1.5rem; display: grid; grid-template-columns: auto 1fr; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; text-align: left; }
  dt, dd { margin: 0; padding: .75rem 1rem; border-top: 1px solid var(--line); }
  dt:first-of-type, dd:first-of-type { border-top: 0; }
  dt { font-size: .85rem; color: var(--muted); background: color-mix(in srgb, var(--line) 35%, transparent); white-space: nowrap; }
  dd { font-weight: 600; word-break: break-word; }
  dd.end { color: var(--brand); font-size: 1.1rem; }
  .note { margin: 0; font-size: .8rem; color: var(--muted); }
  footer { padding: .9rem; border-top: 1px solid var(--line); font-size: .8rem; color: var(--muted); text-align: center; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 50% { opacity: .3; } }
  @keyframes flow { to { background-position: -200% 0; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  @media (max-width: 480px) { .body { padding: 1.75rem 1.25rem 1.5rem; } h1 { font-size: 1.25rem; } }
</style>
</head>
<body>
<main>
  <div class="bar"></div>
  <div class="body">
    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </div>
    <span class="badge" id="badge">メンテナンス中</span>
    <h1 id="title">ただいまメンテナンス中です</h1>
    <p class="lead" id="lead">システム更新のため、一時的にご利用いただけません。<br>数分ほどで再開します。</p>
    <dl id="schedule" hidden>
      <dt>開始</dt><dd id="start">—</dd>
      <dt>終了予定</dt><dd class="end" id="end">未定</dd>
      <dt id="reason-label" hidden>内容</dt><dd id="reason" hidden></dd>
    </dl>
    <p class="note">再開すると、このページは自動でログイン画面に切り替わります。</p>
  </div>
  <footer>鎌倉児童ホーム 食数管理システム</footer>
</main>
<script>
  // 手動メンテナンス時だけ maintenance.json（開始・終了予定・内容）がある。無ければデプロイ中の短時間メンテナンス
  const $ = (id) => document.getElementById(id);
  async function loadInfo() {
    try {
      const res = await fetch('/kamaho-shokusu/webroot/maintenance.json', { cache: 'no-store' });
      if (!res.ok) return;
      const d = await res.json();
      $('title').textContent = '緊急メンテナンスを実施しています';
      $('lead').textContent = '終了まで、今しばらくお待ちください。';
      $('start').textContent = d.start || '—';
      $('end').textContent = d.end || '未定（終わり次第再開します）';
      if (d.reason) { $('reason').textContent = d.reason; $('reason').hidden = $('reason-label').hidden = false; }
      $('schedule').hidden = false;
    } catch (e) { /* 情報が無くても画面は出す */ }
  }
  // 30秒ごとに再開を確認（503 以外 = 再開）。通信エラーは再起動中とみなして待つ
  async function checkResume() {
    try {
      const res = await fetch('/kamaho-shokusu/MUserInfo/login', { cache: 'no-store', redirect: 'manual' });
      if (res.status !== 503) { location.replace('/kamaho-shokusu/'); return; }
    } catch (e) { /* 待機 */ }
    loadInfo();
  }
  loadInfo();
  setInterval(checkResume, 30000);
</script>
</body>
</html>
