name: Deploy to Sakura VPS

on:
  push:
    branches: [ main ]
  # 公式イメージ(php:8.3-apache)のセキュリティ更新を、コード変更なしで本番に取り込むための手動実行
  workflow_dispatch:

concurrency:
  group: deploy-to-vps
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  phpunit:
    name: PHPUnit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src_web/kamaho-shokusu
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_sqlite
          coverage: none
          tools: composer:2

      - name: Validate Composer
        run: composer validate --no-check-publish

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHPUnit
        run: vendor/bin/phpunit --configuration phpunit.xml.dist tests/TestCase/Policy tests/TestCase/Service --colors=never

  deploy:
    name: Deploy to VPS
    needs: phpunit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SLACK_USERNAME: DeployBot
      SLACK_ICON: https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.PROD_USER }}
          password: ${{ secrets.PROD_SSH_PASSWORD }}
          port: 22
          timeout: 60s
          command_timeout: 20m
          envs: REPO_URL,BRANCH,DB_NAME,DB_USER,DB_PASS,DB_ROOT_PASS,DB_CONTAINER,RESEND_API_KEY,SLACK_CONTACT_WEBHOOK
          script: |
            set -euo pipefail

            DEPLOY_PATH="/home/ubuntu/shokusuu1"
            WEB_CONTAINER="kamakura-shokusu_web"
            BRANCH="${BRANCH:-main}"

            # デプロイ先へ移動（初回は空ディレクトリ想定）
            mkdir -p "$DEPLOY_PATH"
            cd "$DEPLOY_PATH"

            # 初回 clone or 既存更新
            if [ ! -d .git ]; then
              if [ -z "${REPO_URL:-}" ]; then
                echo "ERROR: secrets.REPO_URL が未設定です（例: git@github.com:oohashikazuyuki/shokusuu1.git）。" >&2
                exit 1
              fi
              echo "[INIT] cloning $REPO_URL (branch: $BRANCH)"
              git clone --branch "$BRANCH" "$REPO_URL" .
            else
              echo "[UPDATE] fetching & resetting to origin/$BRANCH"
              git fetch origin --prune
              git checkout "$BRANCH" || git checkout -b "$BRANCH"
              git reset --hard "origin/$BRANCH"
            fi

            # ── メンテナンス画面 ON（成功・失敗・中断のいずれでも終了時に必ず OFF） ──
            # 手動で ON にしていた場合（デプロイ前からファイルがある）は、デプロイ後も ON のまま残す
            MAINT_FLAG="$DEPLOY_PATH/src_web/kamaho-shokusu/MAINTENANCE"
            if [ -f "$MAINT_FLAG" ]; then
              echo "[MAINTENANCE] 手動で ON 済み — デプロイ後も ON のまま（解除: rm ${MAINT_FLAG}）"
            else
              # 中身が空 = デプロイが作ったもの。途中で手動 ON（中身 "manual"）にされた場合は消さない
              trap '[ -s "$MAINT_FLAG" ] || rm -f "$MAINT_FLAG"; echo "[MAINTENANCE] 終了時: $([ -f "$MAINT_FLAG" ] && echo ON || echo OFF)"' EXIT
              trap 'exit 1' HUP INT TERM
              : > "$MAINT_FLAG"
              echo "[MAINTENANCE] ON"
            fi

            # ── コンテナ起動 ────────────────────────────────────────────────────
            echo "── Starting Docker containers ───────────────────────────────────"
            # 停止中のリバースプロキシを先に起動して名前競合を回避
            docker start docker-network-reverse-1 2>/dev/null || true
            # ベースイメージの最新パッチを取り込んで再ビルド（変化があれば次の up でコンテナを再作成）
            docker compose -f "$DEPLOY_PATH/docker/docker-compose.yml" build --pull kamakura-shokusu_web
            # アプリサービスのみ起動・再作成（--no-depsで他サービスを処理しない）
            docker compose -f "$DEPLOY_PATH/docker/docker-compose.yml" up -d --no-deps kamakura-shokusu_web kamakura-shokusu_db
            # DBコンテナが受付可能になるまで待機（最大30秒）
            for i in $(seq 1 30); do
              if docker exec "${DB_CONTAINER}" mysqladmin ping -u root -p"${DB_ROOT_PASS}" --silent 2>/dev/null; then
                echo "DB ready after ${i}s"
                break
              fi
              sleep 1
            done

            # ── Composer install (composer.lock が変わった時のみ実行) ─────────
            # 本番の vendor/ は git 管理外のため、これが無いと composer.lock を更新しても
            # 本番に反映されない（CakePHP 5.0.10 のまま放置された実績あり）。
            LOCK_FILE="$DEPLOY_PATH/src_web/kamaho-shokusu/composer.lock"
            HASH_CACHE="/tmp/shokusuu1_composer_lock_hash"
            CURR_HASH="$(sha256sum "$LOCK_FILE" | awk '{print $1}')"
            PREV_HASH="$(cat "$HASH_CACHE" 2>/dev/null || echo '')"
            if [ "$CURR_HASH" != "$PREV_HASH" ]; then
              echo "[Composer] composer.lock changed — running install"
              composer_install() {
                docker exec -e COMPOSER_CACHE_DIR=/tmp/composer-cache "${WEB_CONTAINER}" composer install \
                  --no-dev --no-interaction --optimize-autoloader \
                  --working-dir=/var/www/html/kamaho-shokusu
              }
              if ! composer_install; then
                echo "[Composer] install failed — retrying once"
                sleep 5
                composer_install
              fi
              printf '%s' "$CURR_HASH" > "$HASH_CACHE"
            else
              echo "[Composer] composer.lock unchanged — skipping install"
            fi

            # ── SQL更新適用（sql/updates/*.sql を1回ずつ実行） ────────────────
            echo "── Applying SQL migrations ──────────────────────────────────────"
            ./scripts/apply_sql_updates.sh \
              "${DB_CONTAINER}" \
              "${DB_NAME}" \
              root \
              "${DB_ROOT_PASS}" \
              sql/updates

            # ── plugins.php が存在しない場合は生成 ───────────────────────────
            PLUGINS_FILE="$DEPLOY_PATH/src_web/kamaho-shokusu/config/plugins.php"
            [ -f "$PLUGINS_FILE" ] || printf '<?php\nreturn [];\n' > "$PLUGINS_FILE"

            # ── CakePHP マイグレーション実行 ──────────────────────────────────
            echo "── Running CakePHP migrations ───────────────────────────────────"
            docker compose -f "$DEPLOY_PATH/docker/docker-compose.yml" exec -T kamakura-shokusu_web php /var/www/html/kamaho-shokusu/bin/cake migrations migrate

            # ── アプリ用 .env に環境変数を注入（コンテナの env_file と同じパス） ──
            ENV_FILE="$DEPLOY_PATH/src_web/kamaho-shokusu/.env"
            touch "$ENV_FILE"
            for KEY_VAL in "RESEND_API_KEY=${RESEND_API_KEY}" "SLACK_CONTACT_WEBHOOK=${SLACK_CONTACT_WEBHOOK}"; do
              KEY="${KEY_VAL%%=*}"
              if grep -q "^${KEY}=" "$ENV_FILE" 2>/dev/null; then
                sed -i "s|^${KEY}=.*|${KEY_VAL}|" "$ENV_FILE"
              else
                echo "${KEY_VAL}" >> "$ENV_FILE"
              fi
            done

            echo "✅ Deployed: $(git rev-parse --short HEAD) @ $(date -u +%Y-%m-%dT%H:%M:%SZ)"
        env:
          REPO_URL:     ${{ secrets.REPO_URL }}
          BRANCH:       main
          DB_NAME:      ${{ secrets.DB_NAME }}
          DB_USER:      ${{ secrets.DB_USER }}
          DB_PASS:      ${{ secrets.DB_PASS }}
          DB_ROOT_PASS: ${{ secrets.DB_ROOT_PASS }}
          DB_CONTAINER:    ${{ secrets.DB_CONTAINER }}
          RESEND_API_KEY:          ${{ secrets.RESEND_API_KEY }}
          SLACK_CONTACT_WEBHOOK:   ${{ secrets.SLACK_CONTACT_WEBHOOK }}

      - name: Slack Notification on Success
        uses: rtCamp/action-slack-notify@v2
        if: ${{ success() }}
        env:
          SLACK_TITLE: Deploy / Success
          SLACK_COLOR: good
          SLACK_MESSAGE: デプロイ完了しました🚀

      - name: Slack Notification on Failure
        uses: rtCamp/action-slack-notify@v2
        if: ${{ failure() }}
        env:
          SLACK_TITLE: Deploy / Failure
          SLACK_COLOR: danger
          SLACK_MESSAGE: "<@${{ secrets.SLACK_MENTION_USER_ID }}> デプロイ失敗しました😢"
