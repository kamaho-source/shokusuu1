name: Age Update

on:
  schedule:
    - cron: '0 15 31 3 *'   # JST 4月1日 0:00 に相当（UTC 3月31日 15:00）
  workflow_dispatch:          # 手動実行も可能

jobs:
  age-update:
    name: Annual Age Update
    runs-on: ubuntu-latest
    # 本番サーバー専用: main ブランチのみ実行
    if: github.ref == 'refs/heads/main'
    env:
      SLACK_USERNAME: DeployBot
      SLACK_ICON: https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

    steps:
      # 年齢の加算と年代（i_user_rank）の繰り上げを1つの UPDATE で行う。年度ごとに実行済みの記録を残すので、二重には上がらない。
      # （以前の scripts/age_update.sh は i_enable = 1＝無効な利用者だけを上げ、年代も繰り上げていなかった）
      # コンテナ内では bin/cake が起動しないため、bin/cake.php を php で呼ぶ。
      - name: SSH into production server and run fiscal rollover
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -euo pipefail
            docker exec kamakura-shokusu_web php /var/www/html/kamaho-shokusu/bin/cake.php fiscal:rollover

      - name: Slack Notification on Success
        uses: rtCamp/action-slack-notify@v2
        if: ${{ success() }}
        env:
          SLACK_TITLE: Age Update / Success
          SLACK_COLOR: good
          SLACK_MESSAGE: 年齢更新完了しました✅

      - name: Slack Notification on Failure
        uses: rtCamp/action-slack-notify@v2
        if: ${{ failure() }}
        env:
          SLACK_TITLE: Age Update / Failure
          SLACK_COLOR: danger
          SLACK_MESSAGE: "<@${{ secrets.SLACK_MENTION_USER_ID }}> 年齢更新失敗しました😢"
