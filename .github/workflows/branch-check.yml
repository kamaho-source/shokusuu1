name: Branch Check

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  branch-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check source branch for PR to main
        if: github.base_ref == 'main'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ "$HEAD_REF" != release ]] && \
             [[ "$HEAD_REF" != release/* ]] && \
             [[ "$HEAD_REF" != hotfix/* ]]; then
            echo "ERROR: main へのPRは release・release/*・hotfix/* ブランチからのみ許可されています。"
            echo "現在のブランチ: $HEAD_REF"
            exit 1
          fi
          echo "OK: $HEAD_REF -> main"

      - name: Check source branch for PR to develop
        if: github.base_ref == 'develop'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ "$HEAD_REF" != feature/* ]] && \
             [[ "$HEAD_REF" != fix/* ]] && \
             [[ "$HEAD_REF" != hotfix/* ]] && \
             [[ "$HEAD_REF" != main ]]; then
            echo "ERROR: develop へのPRは feature/・fix/・hotfix/・main ブランチからのみ許可されています。"
            echo "現在のブランチ: $HEAD_REF"
            exit 1
          fi
          echo "OK: $HEAD_REF -> develop"
